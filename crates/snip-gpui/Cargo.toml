[package]
name = "snip-gpui"
version = "0.1.2"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "snip-snip"
path = "src/main.rs"

[dependencies]
snip-core.workspace = true
snip-cloud = { path = "../snip-cloud" }
anyhow.workspace = true
arboard.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
futures.workspace = true
global-hotkey.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image.workspace = true
keyring-core = "1"
open = "5"
unicode-segmentation.workspace = true
xcap.workspace = true
tempfile = "3"
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSEvent"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm"] }

[build-dependencies]
embed-resource = "3"
image = { workspace = true, features = ["ico"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
