[package]
name = "snip-gpui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "snip-snip"
path = "src/main.rs"

[dependencies]
snip-core.workspace = true
anyhow.workspace = true
arboard.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
futures.workspace = true
global-hotkey.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image.workspace = true
unicode-segmentation.workspace = true
xcap.workspace = true
tempfile = "3"
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
