[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# No unsafe code; a future platform shim must opt in with `#[allow(unsafe_code)]`
# and give each block a `// SAFETY:` comment.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
snip-core = { path = "crates/snip-core" }
anyhow = "1"
cosmic-text = "0.19"
global-hotkey = "0.8"
# GPUI isn't released on crates.io past 0.2.2; pin Zed's source. Bump both
# together, along with rust-toolchain.toml.
gpui = { git = "https://github.com/zed-industries/zed", rev = "9ab0715969e9854f2efe61a9d782e7698e5fe6d2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "9ab0715969e9854f2efe61a9d782e7698e5fe6d2" }
image = { version = "0.25", default-features = false, features = ["png"] }
tiny-skia = "0.12"
xcap = "0.9"
arboard = "3.6"
futures = "0.3"
